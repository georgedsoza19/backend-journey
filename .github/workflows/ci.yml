name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  phase-01:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter @backend-journey/phase-01-cli-todo typecheck
