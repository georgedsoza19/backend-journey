# Infra (default):
#   docker compose up -d
#
# Full Phase 5 stack (Postgres + Redis + API):
#   docker compose --profile feed up -d --build
#
# Then: curl http://localhost:3005/health && curl http://localhost:3005/ready

services:
  postgres:
    image: postgres:17
    ports:
      # Host 5433 avoids clashing with a local Postgres on 5432
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: backend_journey
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  feed-api:
    profiles: ["feed"]
    build:
      context: .
      dockerfile: apps/phase-05-cached-feed-api/Dockerfile
    ports:
      - "3005:3005"
    environment:
      NODE_ENV: production
      PORT: "3005"
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/cached_feed?schema=public
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost:3000
      JWT_ACCESS_SECRET: docker-dev-access-secret-min-32-chars
      JWT_REFRESH_SECRET: docker-dev-refresh-secret-min-32-chars
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 7d
      FEED_CACHE_TTL_SECONDS: "30"
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3005/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  postgres_data:
